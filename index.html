<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExChaos — From chaos, worlds.</title>
<meta name="description" content="Jogos de navegador nascidos do caos. ExChaos — from chaos, worlds.">
<meta property="og:title" content="ExChaos">
<meta property="og:description" content="Jogos de navegador nascidos do caos. From chaos, worlds.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://exchaos.com.br">
<link rel="icon" href="/assets/brand/exchaos-favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/brand/exchaos-favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/brand/exchaos-favicon-180.png">
<link rel="stylesheet" href="/assets/brand/exchaos.css">
<style>
  body{display:flex;flex-direction:column;text-align:center}
  main{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;padding:clamp(28px,6vw,64px) 22px;animation:rise 1s ease both;
  }
  .seal-wrap{position:relative;display:grid;place-items:center;margin-bottom:14px}
  .glow{
    position:absolute;width:118%;height:118%;border-radius:50%;
    background:radial-gradient(circle, rgba(154,107,232,.34), rgba(154,107,232,0) 68%);
    filter:blur(6px);animation:breathe 5.5s ease-in-out infinite;
  }
  .seal{position:relative;width:clamp(128px,26vw,176px);height:auto;filter:drop-shadow(0 0 14px rgba(154,107,232,.35))}
  .ring-spin{transform-origin:100px 100px;animation:spin 96s linear infinite}
  .wordmark{font-family:var(--fd);font-weight:600;font-size:clamp(52px,12vw,104px);line-height:.9;letter-spacing:.02em;margin:0;color:var(--parchment)}
  .wordmark b{color:var(--arcane);font-weight:600}
  .tagline{font-family:var(--fb);font-style:italic;font-size:clamp(18px,3.2vw,26px);color:var(--parchment-dim);margin:14px 0 0}
  .etym{font-family:var(--fm);font-size:12px;color:var(--muted);margin:12px 0 0;letter-spacing:.18em}
  .rule{margin:28px 0 24px}
  .teaser{font-family:var(--fb);font-size:clamp(15px,2.3vw,18px);color:var(--parchment-dim);max-width:30ch;margin:0}
  .badge{font-family:var(--fm);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--candle);margin:22px 0 26px;display:inline-flex;align-items:center;gap:10px}
  .badge::before,.badge::after{content:"";width:20px;height:1px;background:var(--candle);opacity:.5}
  .actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  footer{padding:26px 22px;border-top:1px solid var(--line);font-family:var(--fm);font-size:12px;color:var(--muted);letter-spacing:.06em;display:flex;gap:8px 20px;justify-content:center;flex-wrap:wrap;align-items:center}
  footer a{color:var(--parchment-dim)}
  footer a:hover{color:var(--arcane)}
  footer .sep{opacity:.4}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes breathe{0%,100%{opacity:.7;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){main{animation:none}.glow{animation:none}.ring-spin{animation:none}}
</style>
</head>
<body>
  <main>
    <div class="seal-wrap">
      <div class="glow"></div>
      <svg class="seal" viewBox="0 0 200 200" role="img" aria-label="ExChaos">
        <defs>
          <g id="arrow">
            <path class="star" stroke-width="7" d="M100,84 L100,42"/>
            <path class="head" d="M100,33 L109,48 L91,48 Z"/>
          </g>
        </defs>
        <circle class="ring" cx="100" cy="100" r="94" stroke-width="1.4"/>
        <circle class="ring ring-spin" cx="100" cy="100" r="91" stroke-width="2.2" stroke-dasharray="2 10"/>
        <circle class="ring" cx="100" cy="100" r="87" stroke-width="0.7"/>
        <g class="gold">
          <circle cx="150" cy="70" r="1.3"/><circle cx="52" cy="126" r="1.1"/>
          <circle cx="126" cy="150" r="1.2"/><circle cx="70" cy="52" r="1"/>
        </g>
        <use href="#arrow" transform="rotate(0 100 100)"/>
        <use href="#arrow" transform="rotate(45 100 100)"/>
        <use href="#arrow" transform="rotate(90 100 100)"/>
        <use href="#arrow" transform="rotate(135 100 100)"/>
        <use href="#arrow" transform="rotate(180 100 100)"/>
        <use href="#arrow" transform="rotate(225 100 100)"/>
        <use href="#arrow" transform="rotate(270 100 100)"/>
        <use href="#arrow" transform="rotate(315 100 100)"/>
        <path class="gold" d="M100,92 L101.8,98.2 L108,100 L101.8,101.8 L100,108 L98.2,101.8 L92,100 L98.2,98.2 Z"/>
      </svg>
    </div>
    <h1 class="wordmark">Ex<b>Chaos</b></h1>
    <p class="tagline">From chaos, worlds.</p>
    <p class="etym">ex chaos · a partir do caos</p>
    <hr class="rule">
    <div class="badge">Em breve</div>
    <div class="actions">
      <a class="btn btn--primary" href="/jogos/">Ver os jogos</a>
      <a class="btn btn--ghost" href="https://instagram.com/PlayExChaos" target="_blank" rel="noopener">Instagram</a>
    </div>
  </main>
  <footer>
    <span>© 2026 ExChaos</span>
    <span class="sep">·</span>
    <a href="mailto:contato@exchaos.com.br">contato@exchaos.com.br</a>
    <span class="sep">·</span>
    <a href="https://instagram.com/PlayExChaos" target="_blank" rel="noopener">@PlayExChaos</a>
  </footer>
</body>
</html>
