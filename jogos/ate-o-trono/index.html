<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Até o Trono — sete provas, uma companhia | ExChaos</title>
    <meta
      name="description"
      content="Recrute cinco heróis de todas as eras e atravesse sete provas até o trono do Rei Demônio. O difícil não é chegar: é chegar com todo mundo."
    />

    <!--
      Caminhos relativos, como todo o resto do site: o `base: './'` do Vite
      existe para o jogo funcionar servido de um subcaminho
      (exchaos.com.br/ate-o-trono/), e um `/` inicial buscaria na raiz do
      domínio.
    -->
    <link rel="icon" href="./exchaos-favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./exchaos-favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./exchaos-favicon-180.png" />

    <!--
      As três fontes da marca: Grenze Gotisch nos títulos, Spectral no corpo,
      IBM Plex Mono nos números. `display=swap` mantém o texto legível durante o
      carregamento — o jogo é de leitura, e tela em branco esperando fonte seria
      pior que um instante com a fonte de sistema.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400;600&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/src/estilo.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
