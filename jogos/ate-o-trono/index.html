    <!--
      As `og:` usam URL absoluta de propósito, ao contrário de todo o resto

    -->

    <meta property="og:site_name" content="ExChaos" />
    <meta property="og:locale" content="pt_BR" />

      property="og:description"
      content="Recrute cinco heróis de todas as eras e despache esquadrões contra sete missões. O difícil não é vencer uma — é ainda ter gente de pé na última."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://exchaos.com.br/jogos/ate-o-trono/" />

    <meta property="og:image:height" content="630" />

      property="og:image:alt"

    <!--
      Caminhos relativos, como todo o resto do site: o `base: './'` do Vite
      existe para o jogo funcionar servido de um subcaminho
      (exchaos.com.br/ate-o-trono/), e um `/` inicial buscaria na raiz do
      domínio.

    <link rel="icon" href="./exchaos-favicon.svg" type="image/svg+xml" />

    <!--
      As três fontes da marca: Grenze Gotisch nos títulos, Spectral no corpo,
      IBM Plex Mono nos números. `display=swap` mantém o texto legível durante o
      carregamento — o jogo é de leitura, e tela em branco esperando fonte seria
      pior que um instante com a fonte de sistema.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
